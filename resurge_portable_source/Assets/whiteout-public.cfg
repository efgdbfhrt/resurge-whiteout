// Whiteout public TDM for EZZ BOIII dedicated servers.
// Target 12 combined players and bots. Capacity leaves six slots for joining players.
set live_steam_server_name "Whiteout | Public TDM | Veteran bots"
set live_steam_server_description "Community TDM. Veteran bots fill vacant team places."
set live_steam_server_password ""
set g_password ""
set rcon_password ""
set sv_privateClients "0"
set sv_lanOnly "0"
set com_maxclients "18"
set sv_lobby_mode "mp"
set sv_skip_lobby "1"
set bot_maxAllies "6"
set bot_maxAxis "6"
set bot_maxFree "0"
set bot_difficulty "3"
set scr_teambalance "1"
set sv_floodProtect "1"
set logfile "2"
exec "gamedata/gamesettings/mp/gamesettings_tdm.cfg"
set sv_maprotation "gametype tdm map mp_sector map mp_veiled map mp_stronghold"
